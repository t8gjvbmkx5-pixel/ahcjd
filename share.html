<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오톡으로 청첩장 보내기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf6ef;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      color: #28362c;
    }
    .wrap {
      width: min(92%, 420px);
      text-align: center;
      padding: 40px 24px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 23px;
      font-weight: 600;
    }
    p {
      margin: 0 0 28px;
      color: #666;
      font-size: 14px;
      line-height: 1.7;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 16px 18px;
      background: #fee500;
      color: #191919;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:active { transform: scale(0.99); }
    #status {
      min-height: 22px;
      margin-top: 16px;
      font-size: 13px;
      color: #b42318;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>청첩장 공유하기</h1>
    <p>아래 버튼을 누르면 카카오톡에서<br>보낼 친구나 채팅방을 선택할 수 있습니다.</p>
    <button type="button" id="shareButton">카카오톡으로 보내기</button>
    <div id="status" aria-live="polite"></div>
  </main>

  <script
    src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"
    crossorigin="anonymous">
  </script>
  <script>
    const JAVASCRIPT_KEY = "165ef3a3143d0a63c19453ee293ee3f7";
    const INVITATION_URL = "https://t8gjvbmkx5-pixel.github.io/ahcjd/";
    const IMAGE_URL = "https://t8gjvbmkx5-pixel.github.io/ahcjd/og-image.jpg";
    const LOCATION_URL = "https://map.kakao.com/?q=%EC%84%9C%EC%9A%B8%EB%93%9C%EB%9E%98%EA%B3%A4%EC%8B%9C%ED%8B%B0%20%EA%B7%B8%EB%9E%9C%EB%93%9C%20%EB%A8%B8%ED%81%90%EC%96%B4";

    const status = document.getElementById("status");

    try {
      if (!window.Kakao) {
        throw new Error("카카오 SDK를 불러오지 못했습니다.");
      }

      if (!Kakao.isInitialized()) {
        Kakao.init(JAVASCRIPT_KEY);
      }
    } catch (error) {
      status.textContent = error.message;
    }

    document.getElementById("shareButton").addEventListener("click", function () {
      status.textContent = "";

      try {
        if (!window.Kakao || !Kakao.isInitialized()) {
          throw new Error("카카오 공유 기능을 초기화하지 못했습니다.");
        }

        Kakao.Share.sendDefault({
          objectType: "feed",
          content: {
            title: "최재원 ♥ 이시은 결혼식에 초대합니다",
            description: "2026년 12월 5일 토요일 오후 6시 · 서울 드래곤시티 그랜드 머큐어 2층 라데부홀",
            imageUrl: IMAGE_URL,
            link: {
              mobileWebUrl: INVITATION_URL,
              webUrl: INVITATION_URL
            }
          },
          buttons: [
            {
              title: "청첩장 보기",
              link: {
                mobileWebUrl: INVITATION_URL,
                webUrl: INVITATION_URL
              }
            },
            {
              title: "위치 보기",
              link: {
                mobileWebUrl: LOCATION_URL,
                webUrl: LOCATION_URL
              }
            }
          ]
        });
      } catch (error) {
        status.textContent = error.message || "공유창을 열지 못했습니다.";
      }
    });
  </script>
</body>
</html>
